# Local PostgreSQL for development. Version 18 is offered by Neon, the intended hosted database.
name: flight-booking

services:
  postgres:
    image: postgres:18-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: flights
      POSTGRES_PASSWORD: flights
      POSTGRES_DB: flights
    ports:
      - '5432:5432'
    volumes:
      # From PostgreSQL 18 the image keeps its data under /var/lib/postgresql/<major>/,
      # so the volume is mounted one level up from the older /var/lib/postgresql/data.
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U flights -d flights']
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres-data:
